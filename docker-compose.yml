services:
  dispatcher:
    build: .
    container_name: dispatcher
    restart: unless-stopped
    ports:
      - "8000:8010"   # 宿主仅开放 8000 端口映射
    volumes:
      - ./data:/app/data
    environment:
      # 高德地图（JS API key + 安全密钥）；留空则用自绘示意图
      - AMAP_JS_KEY=${AMAP_JS_KEY:-}
      - AMAP_SECURITY_CODE=${AMAP_SECURITY_CODE:-}
      - AMAP_WEB_KEY=${AMAP_WEB_KEY:-}
      - DISPATCHER_PASSWORD=${DISPATCHER_PASSWORD:-}
