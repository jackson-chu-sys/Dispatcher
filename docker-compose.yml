services:
  dispatcher:
    build: .
    container_name: dispatcher
    restart: unless-stopped
    ports:
      - "${COMPOSE_HOST_PORT:-8000}:8010"   # 宿主端口可用 COMPOSE_HOST_PORT 覆盖（默认 8000）
    volumes:
      - ./data:/app/data
    environment:
      # 高德地图（JS API key + 安全密钥）；留空则用自绘示意图
      - AMAP_JS_KEY=${AMAP_JS_KEY:-}
      - AMAP_SECURITY_CODE=${AMAP_SECURITY_CODE:-}
      - AMAP_WEB_KEY=${AMAP_WEB_KEY:-}
      - DISPATCHER_PASSWORD=${DISPATCHER_PASSWORD:-}
      # 通知（企业微信群机器人 webhook，多个逗号分隔；留空则通知待命）
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - NOTIFY_ENABLED=${NOTIFY_ENABLED:-1}
      # DEMO 模式：登录页列出演示账号一键登录（试用=1，正式=0）
      - DEMO_MODE=${DEMO_MODE:-0}
