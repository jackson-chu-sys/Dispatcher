services:
  dispatcher:
    build: .
    container_name: dispatcher
    restart: unless-stopped
    ports:
      - "8000:8010"   # 宿主仅开放 8000 端口映射
    volumes:
      - ./data:/app/data
    environment:
      # 腾讯位置服务 key（WebServiceAPI + 地图 JS API）；留空则用自绘示意图
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY:-}
