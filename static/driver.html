<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatcher · 司机端</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  main{max-width:720px}
  .stop-btn{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px 12px}
  .stop-btn.current{border-color:#2f6fed;background:#141d31}
  .stop-btn small{color:#8b9ab5}
  .who{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header>
  <h1>Dispatcher <span style="color:#8b9ab5;font-weight:400">· 司机端</span></h1>
  <nav class="nav">
    <a href="/driver" class="active">司机端</a>
    <a href="/rider">乘客端</a>
    <a href="/dispatcher">调度端</a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="who">
      <div><strong id="whoName">…</strong> <span class="meta" id="whoVeh" style="color:#8b9ab5"></span></div>
      <button class="sm" onclick="Auth.logout()">退出</button>
    </div>
    <div class="hint" id="connHint">连接中…</div>
  </section>
  <section class="card">
    <h2>我的班次</h2>
    <div id="shifts"><div class="empty">加载中…</div></div>
  </section>
  <section class="card">
    <h2>待处理叫车</h2>
    <div id="rides"><div class="empty">加载中…</div></div>
  </section>
</main>

<script src="/static/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const BADGE = { waiting: '等待接单', accepted: '已接单（去接）', boarded: '已上车', done: '已送达' };
if (!Auth.guard(['driver', 'dispatcher'])) throw new Error('need login');
const me = Auth.user;
const driverId = me.role === 'driver' ? me.id : Number(localStorage.getItem('dispatcher.driver') || 1);
$('#whoName').textContent = me.name;

let lastData = null;

function ago(iso) { return fmtAgo(iso); }

function drawHeader(d) {
  $('#whoVeh').textContent = d.vehicle ? `· ${d.vehicle.plate} ${d.vehicle.kind}` : '· 未指派车辆';
}

function drawShifts(d) {
  if (!d.shifts.length) { $('#shifts').innerHTML = '<div class="empty">今日没有班次</div>'; return; }
  $('#shifts').innerHTML = d.shifts.map(s => `
    <div class="status-card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><strong style="color:${s.color}">●</strong> ${s.route_name} · ${s.depart_time} 发车（约 ${s.duration_min} 分钟）</div>
        <span class="badge ${s.trip_status === 'running' ? 'accepted' : ''} ${s.trip_status === 'done' ? 'done' : ''}">${s.trip_status === 'running' ? '运行中' : s.trip_status === 'done' ? '已完成' : '未发车'}</span>
      </div>
      <div style="color:#8b9ab5;font-size:12px;margin-bottom:8px">当前：${s.stop_name || '未发车'} ${s.arrived_at ? '· ' + ago(s.arrived_at) : ''}${s.delay_min != null ? ' · 发车' + (s.delay_min > 0 ? '晚 ' + s.delay_min + ' 分' : s.delay_min < 0 ? '早 ' + (-s.delay_min) + ' 分' : '准点') : ''}</div>
      ${s.trip_status === 'waiting' ? `<button class="primary" onclick="start(${s.shift_id})">开始发车</button>` : ''}
      ${s.trip_status === 'running' ? `
      <div style="margin-top:10px">
        ${s.stops.map(st => `<button class="stop-btn ${st.id === s.current_stop_id ? 'current' : ''}" onclick="arrive(${st.id}, ${s.shift_id}, ${st.id === s.stops[s.stops.length - 1].id})">
          ${st.seq}. ${st.name} ${st.id === s.current_stop_id ? '<small>← 当前位置</small>' : ''}</button>`).join('')}
        <label style="display:flex;align-items:center;gap:6px;margin:8px 0;font-size:13px;color:var(--text)">
          <input type="checkbox" id="doneAfter"> 末站到站后直接结束班次
        </label>
        <button class="sm" onclick="finish(${s.shift_id})">结束班次</button>
      </div>
      <div class="hint">到站后点对应站点，调度端与乘客端立刻看到这辆车在这里（WebSocket 实时推送）。</div>` : ''}
    </div>`).join('');
}

function drawRides(rs) {
  if (!rs.length) { $('#rides').innerHTML = '<div class="empty">暂无叫车</div>'; return; }
  $('#rides').innerHTML = rs.map(r => `
    <div class="ride">
      <div class="hd"><strong>${r.rider} · ${r.people} 人</strong><span class="badge ${r.status}">${BADGE[r.status] || r.status}</span></div>
      <div class="route">${r.from_name} → ${r.to_name} · 叫车于 ${r.created_at.slice(11, 19)}${r.eta_min != null ? ' · 预计 ' + r.eta_min + ' 分钟到终点' : ''}</div>
      <div style="display:flex;gap:6px">
        ${r.status === 'waiting' ? `<button class="primary sm" onclick="accept(${r.id})">接单</button>` : ''}
        ${r.status === 'accepted' ? `<button class="ok sm" onclick="board(${r.id})">已接到乘客</button>` : ''}
        ${r.status === 'boarded' ? `<button class="sm" onclick="doneRide(${r.id})">送达完成</button>` : ''}
      </div>
    </div>`).join('');
}

async function post(url, body) {
  try {
    await Auth.api(url, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
  } catch (e) { alert('操作失败：' + e.message); }
  refresh();
}
const start = shiftId => post(`/api/driver/${driverId}/start`, { shift_id: shiftId });
const finish = shiftId => post(`/api/driver/${driverId}/finish`, { shift_id: shiftId });
function arrive(stopId, shiftId, isLast) {
  const doneAfter = isLast && document.getElementById('doneAfter') && document.getElementById('doneAfter').checked;
  post(`/api/driver/${driverId}/arrive`, { stop_id: stopId, shift_id: shiftId, done_after: doneAfter });
}
const accept = id => post(`/api/ride/${id}/accept`, { driver_id: driverId });
const board = id => post(`/api/ride/${id}/board`);
const doneRide = id => post(`/api/ride/${id}/done`);

async function refresh() {
  try {
    const d = await Auth.api(`/api/driver/${driverId}`);
    if (d.detail) return;
    lastData = d;
    drawHeader(d); drawShifts(d); drawRides(d.rides);
  } catch (e) { console.error(e); }
}

/* 实时：WS 收到状态就刷新自己的数据（司机数据需单独拉） */
let wsPending = false;
Live.start(() => {
  if (!wsPending) { wsPending = true; setTimeout(() => { wsPending = false; refresh(); }, 300); }
  $('#connHint').textContent = '● 实时连接正常 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
}, 4000);

refresh();
</script>
</body>
</html>
